[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mfvalidate"
version = "0.1.0"
description = "Independent, second-line validation of a macro-driver forecasting model, with an agent that drafts the report and a human who signs it off"
requires-python = ">=3.9"
dependencies = ["numpy", "pandas", "scipy", "statsmodels", "matplotlib", "pyyaml"]

[project.scripts]
mfvalidate = "mfvalidate.cli:main"

[tool.setuptools]
packages = ["mfvalidate", "mfvalidate.checks"]
